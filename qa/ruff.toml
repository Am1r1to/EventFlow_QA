line-length = 120
target-version = "py312"
[lint]
extend-select = [
    "S",    # règles de sécurité
    "T20",  # Détecte les print() oubliés
    "PT",   # Vérifie les bonnes pratiques pytest
    "N",    # Vérifie les conventions de nommage PEP 8
]
ignore = ["S101"]       # assert permis…
[lint.per-file-ignores]
"**/tests/**" = ["S105"]   # mots de passe de test